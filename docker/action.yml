name: 'Docker image creation'
description: 'Build, push and sign docker images'
inputs:
  github-token:
    description: "GitHub Token used to authenticate against a repository for Git context"
    default: ${{ github.token }}
    required: true
  # docker params from docker/build-push-action
  push:
    description: "Push is a shorthand for --output=type=registry"
    required: false
    default: 'false'
  platforms:
    description: "List of target platforms for build"
    required: false
  context:
    description: "Build's context is the set of files located in the specified PATH or URL"
    required: false
  file:
    description: "Path to the Dockerfile"
    required: false
  labels:
    description: "List of metadata for an image"
    required: false
  load:
    description: "Load is a shorthand for --output=type=docker"
    required: false
    default: 'false'
  build-args:
    description: "List of build-time variables"
    required: false
  tags:
    description: "List of tags"
    required: true
  # cache parameters
  cache-from:
    description: "External cache sources (e.g. 'type=gha', 'type=registry,ref=myimage:cache')"
    required: false
    default: "type=gha"
  cache-to:
    description: "Cache export destinations (e.g. 'type=gha,mode=max', 'type=registry,ref=myimage:cache')"
    required: false
    default: "type=gha,mode=max"
  # registry-auth parameters
  ghcr-password:
    description: "Password of ghcr.io."
    required: false
  dockerhub-user:
    description: "User of DockerHub."
    required: false
  dockerhub-password:
    description: "Password of DockerHub."
    required: false
  # signing parameters
  sign:
    description: "Sign image with cosign"
    required: false
    default: 'false'
  cosign-repository:
    description: Custom cosign-repository
    required: false
    default: ""
  # provenance
  provenance:
    description: "Generate buildx SLSA provenance attestation for the image. Only works when pushing to a registry."
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    # QEMU is only needed when building for foreign architectures (multi-arch).
    - name: Set up QEMU
      id: qemu
      if: ${{ inputs.platforms != 'linux/amd64' && inputs.platforms != '' }}
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@8016837eba79c3b51bf2025379f48b6fc50f1236 # v4.0.0

    - name: GHCR Login
      if: ${{ inputs.ghcr-password }}
      env:
        GHCR_PASSWORD: ${{ inputs.ghcr-password }}
      run: echo "$GHCR_PASSWORD" | docker login -u ${{ github.actor }} --password-stdin ghcr.io # zizmor: ignore[template-injection] trusted input
      shell: sh

    - name: DockerHub Login
      if: ${{ inputs.dockerhub-password }}
      env:
        DOCKERHUB_USER: ${{ inputs.dockerhub-user }}
        DOCKERHUB_PASSWORD: ${{ inputs.dockerhub-password }}
      run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USER" --password-stdin
      shell: sh

    - name: Build image
      uses: docker/build-push-action@1031bc45c52785b1a3a0db59db1e207f047a88c5 # v7.0.0
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        github-token: ${{ inputs.github-token }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        labels: ${{ inputs.labels }}
        load: ${{ inputs.load }}
        build-args: ${{ inputs.build-args }}
        tags: ${{ inputs.tags }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
        provenance: ${{ inputs.provenance }}

    - name: Sign image
      if: ${{ inputs.sign == 'true' }}
      run: echo "${{ inputs.tags }}" | grep -v "^$" | while read -r a; do cosign sign -y -r $a; done # zizmor: ignore[template-injection] trusted input
      shell: sh
      env:
        COSIGN_REPOSITORY: ${{ inputs.cosign-repository }}
