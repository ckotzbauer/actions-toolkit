name: Release Toolkit

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.REPO_ACCESS }}

      - name: Update versions
        shell: bash
        env:
          NEW_VERSION: ${{ github.event.inputs.version }}
        run: |
          LAST_TAG=$(git describe --abbrev=0 --tags)
          find .github/workflows/toolkit-*.yml | while read -r a; do
              sed -i "s#@${LAST_TAG}#@${NEW_VERSION}#g" "$a";
              sed -i "s#action-sha: \"${LAST_TAG}\"#action-sha: \"${NEW_VERSION}\"#g" "$a";
          done
          sed -i "s#@${LAST_TAG}#@${NEW_VERSION}#g" .github/workflows/release-toolkit.yml;

      - name: Generate Changelog
        uses: ckotzbauer/changelog-generator@4532c44e171ec8a55980f35f4025285c2c2fd309
        with:
          release-version: ${{ github.event.inputs.version }}
          github-handle: ${{ github.repository }}
          commit-output: commits.md

      - name: Push release
        uses: ckotzbauer/actions-toolkit/push-release@0.58.0 # 0.54.3
        with:
          version: ${{ github.event.inputs.version }}
          pat: ${{ secrets.REPO_ACCESS }}
          prerelease: ${{ contains(github.event.inputs.version, 'alpha') || contains(github.event.inputs.version, 'beta') || contains(github.event.inputs.version, 'rc') }}
