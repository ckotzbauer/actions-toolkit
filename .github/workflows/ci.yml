name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # zizmor SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run actionlint
        shell: bash
        run: |
          curl -sSfL -o checksums.txt https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          curl -sSfL -o actionlint_1.7.12_linux_amd64.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          grep 'actionlint_1.7.12_linux_amd64.tar.gz' checksums.txt | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          # SC2129: repeated >> redirects are intentional; SC2016: awk fields ($0) in single quotes
          ./actionlint -ignore SC2129 -ignore SC2016 -color .github/workflows/*.yml

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          config: zizmor.yml