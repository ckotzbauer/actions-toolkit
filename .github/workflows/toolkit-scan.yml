name: Scan image

on:
  workflow_call:
    inputs:
      docker-tag:
        required: true
        type: string
      fail-on:
        required: false
        default: "medium"
        type: string
    secrets:
      ghcr-password:
        required: false

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GHCR_PASSWORD: ${{ secrets.ghcr-password }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GHCR Login
        if: ${{ env.GHCR_PASSWORD != '' }}
        run: echo "$GHCR_PASSWORD" | docker login -u ${{ github.actor }} --password-stdin ghcr.io
        shell: sh

      - name: Scan image
        uses: ckotzbauer/actions-toolkit/grype@0.58.0 # 0.54.3
        with:
          scan-target: ${{ inputs.docker-tag }}
          fail-on: ${{ inputs.fail-on }}
          config-file: ".github/grype.yaml"
          format: "sarif"
          output: "results.sarif"
        continue-on-error: true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: grype
